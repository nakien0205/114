# Shared runtime configuration for the Fire and Smoke project.
# Relative paths are resolved from the project directory.

data_path: "datasets/DFire/manifest/data.yaml"

paths:
  # Source used by infer.py when --source is omitted.
  inference_source: "datasets/DFire/test/images"

training:
  weights: "path/to/pretrained_weights.pt"
  epochs: 50
  batch: 16
  imgsz: 640
  lr0: 0.01
  lrf: 0.01
  patience: 20
  device: null
  project: "runs/train"
  name: "fire_smoke"
  workers: 4
  optimizer: "auto"
  seed: 42
  freeze: null
  save_period: -1
  exist_ok: true
  val: true
  amp: true
  verbose: true
