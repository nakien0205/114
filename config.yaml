# Shared runtime configuration for the Fire and Smoke project.
# Relative paths are resolved from the project directory.

data_path: "data.yaml"

paths:
  # Source used by infer.py when --source is omitted.
  inference_source: "datasets/DFire/test/images"

training:
  weights: "yolo11n.pt"
  epochs: 200
  batch: 16
  imgsz: 640
  lr0: 0.01
  lrf: 0.01
  patience: 20
  device: cuda:0
  project: "runs/train"
  name: "yolo11n_nwd_test"
  workers: 4
  optimizer: "auto"
  seed: 42
  freeze: null
  save_period: -1
  exist_ok: true
  val: true
  amp: true
  verbose: true

  # Custom NWD
  nwd-weight: 0.25
  nwd-constant: 12.8

  # Custom WIoU
  wiou-monotonous: False
  wiou-alpha: 1.9
  wiou-delta: 3.0
  wiou-momentum: 0.01
