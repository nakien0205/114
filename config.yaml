# Shared runtime configuration for the Fire and Smoke project.
# Relative paths are resolved from the project directory.

data_path: "data.yaml"

paths:
  # Source used by infer.py when --source is omitted.
  inference_source: "datasets/DFire/test/images"

training:
  weights: "weights/yolo26n-p2_new.pt"
  loss: "wiou"
  epochs: 200
  batch: 16
  imgsz: 640
  lr0: 0.001
  lrf: 0.01
  patience: 15
  device: cuda:0
  project: "runs/train"
  name: "yolo26n-p2_wiou"
  workers: 4
  optimizer: "AdamW"
  seed: 42
  freeze: null
  save_period: -1
  exist_ok: true
  val: true
  amp: false
  verbose: true

  # Custom NWD
  nwd_weight: 0.25
  nwd_constant: 12.8

  # Custom WIoU
  wiou_monotonous: False
  wiou_alpha: 1.9
  wiou_delta: 3.0
  wiou_momentum: 0.01
