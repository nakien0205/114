# Approach 1: original YOLO26n-P2 plus two appended Haar residual blocks.
# Build with src.modules.dwt.model.DWTYOLO; stock YOLO rejects custom tags.
# ConvThenHaar means original Conv -> added HaarResidual, before next C3k2.
# Original indices/routes and pretrained parameter names are retained.
nc: 2
end2end: true
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                 # 0 P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1 P2/4
  - [-1, 2, C3k2, [256, false, 0.25]]         # 2
  - [-1, 1, ConvThenHaar, [256, 3, 2]]        # 3 P3/8 Conv + DWT residual
  - [-1, 2, C3k2, [512, false, 0.25]]         # 4
  - [-1, 1, ConvThenHaar, [512, 3, 2]]        # 5 P4/16 Conv + DWT residual
  - [-1, 2, C3k2, [512, true]]                # 6
  - [-1, 1, Conv, [1024, 3, 2]]               # 7 P5/32
  - [-1, 2, C3k2, [1024, true]]               # 8
  - [-1, 1, SPPF, [1024, 5, 3, true]]        # 9
  - [-1, 2, C2PSA, [1024]]                   # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, true]]               # 13
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, true]]               # 16
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, true]]               # 19 P2/4
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, true]]               # 22 P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, true]]               # 25 P4/16
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, true, 0.5, true]]   # 28 P5/32
  - [[19, 22, 25, 28], 1, Detect, [nc]]       # 29 P2/P3/P4/P5
