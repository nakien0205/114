# YOLO26n with four Haar DWT levels. The fourth level produces P4.
nc: 2
end2end: True
reg_max: 1
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  # The backbone returns (P3, P4, P5). Index exposes tensors to the stock neck.
  - [-1, 1, DWTBackboneL4, [3, 64, 128, 256]] # 0
  - [0, 1, Index, [64, 0]]                   # 1 P3/8
  - [0, 1, Index, [128, 1]]                  # 2 P4/16
  - [0, 1, Index, [256, 2]]                  # 3 P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  - [[9, 12, 15], 1, Detect, [nc]]
